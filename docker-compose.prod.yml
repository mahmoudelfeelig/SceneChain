services:
  postgres:
    environment:
      POSTGRES_USER: scenechain_migration
      POSTGRES_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?set MIGRATION_DATABASE_PASSWORD}
      APP_DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
    volumes:
      - ./deploy/postgres/01-application-role.sh:/docker-entrypoint-initdb.d/01-application-role.sh:ro

  backend:
    environment:
      DATABASE_USER: scenechain_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set DATABASE_PASSWORD}
      MIGRATION_DATABASE_USER: scenechain_migration
      MIGRATION_DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?set MIGRATION_DATABASE_PASSWORD}
      COOKIE_SECURE: "true"
      SCENECHAIN_PEPPER: ${SCENECHAIN_PEPPER:?set SCENECHAIN_PEPPER}
      SCENECHAIN_METADATA_KEY: ${SCENECHAIN_METADATA_KEY:?set SCENECHAIN_METADATA_KEY}
      SCENECHAIN_LOOKUP_KEY: ${SCENECHAIN_LOOKUP_KEY:?set SCENECHAIN_LOOKUP_KEY}
      SCENECHAIN_SYNTHETIC_KEY: ${SCENECHAIN_SYNTHETIC_KEY:?set SCENECHAIN_SYNTHETIC_KEY}
      SCENECHAIN_PROTOCOL_SHA256: ${SCENECHAIN_PROTOCOL_SHA256:?set SCENECHAIN_PROTOCOL_SHA256}
      SCENECHAIN_RECRUITMENT_ENABLED: ${SCENECHAIN_RECRUITMENT_ENABLED:-false}
      RESEARCH_ADMIN_USER: ${RESEARCH_ADMIN_USER:?set RESEARCH_ADMIN_USER}
      RESEARCH_ADMIN_PASSWORD: ${RESEARCH_ADMIN_PASSWORD:?set RESEARCH_ADMIN_PASSWORD}
      RESEARCH_PSEUDONYM_KEY: ${RESEARCH_PSEUDONYM_KEY:?set RESEARCH_PSEUDONYM_KEY}

  frontend:
    ports:
      - "127.0.0.1:${SCENECHAIN_PORT:-8088}:80"
