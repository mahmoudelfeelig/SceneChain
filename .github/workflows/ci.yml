name: SceneChain CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn --batch-mode verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: python3 -m py_compile scripts/*.py
      - run: python3 -m json.tool protocol/schemas/credential.schema.json >/dev/null
      - run: python3 -m json.tool protocol/schemas/scene-manifest.schema.json >/dev/null
      - run: python3 -m json.tool protocol/test-vectors/credential-v1.json >/dev/null

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend, repository]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend frontend
      - uses: anchore/scan-action@v6
        with:
          image: graphicalpassword-backend:latest
          fail-build: true
          severity-cutoff: high

  integration:
    runs-on: ubuntu-latest
    needs: [backend, frontend, repository]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - run: |
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8088/api/pack/status && break
            sleep 2
          done
      - run: ./scripts/smoke_test.sh
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v
